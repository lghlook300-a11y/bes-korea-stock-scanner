<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 한국주식 검색기</title>
<style>body{margin:0;background:#071521;color:#ecf5ff;font-family:system-ui}.wrap{max-width:960px;margin:auto;padding:24px 16px}.sub{color:#86a6bd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box,.stock{background:#0d2132;border:1px solid #23425a;border-radius:15px;padding:17px}.n{font-size:27px;font-weight:800}.stock{margin-top:14px}.top{display:flex;justify-content:space-between;gap:10px}.tag{border-radius:9px;padding:6px 10px;font-weight:800;white-space:nowrap}.review{background:#07543f;color:#69f0c0}.wait{background:#63340e;color:#ffb35c}.watch{background:#59470a;color:#ffe06b}.exclude{background:#303b46;color:#c4cfda}.decision{font-size:18px;font-weight:800;margin-top:15px}.why{color:#c9d9e5;margin:7px 0 14px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#091a28;border-radius:11px;padding:12px}.fact span{display:block;color:#86a6bd;font-size:12px;margin-bottom:3px}.details{margin-top:11px;color:#86a6bd}.chartlink{display:block;margin-top:14px;padding:11px;border:1px solid #3b82a8;border-radius:10px;color:#7dd3fc;text-decoration:none;text-align:center;font-weight:800}.chartlink:hover{background:#143e5c}@media(max-width:650px){h1{font-size:27px}.cards{grid-template-columns:repeat(2,1fr)}.box{padding:14px}.n{font-size:22px}.top{align-items:flex-start}.facts{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="wrap"><div style="color:#54d7ae">● 한국시장 일일 데이터</div><h1>BES 한국주식 후보 검색기</h1><p class="sub">시장 → 거래대금 → 가격 구조를 확인한 연구용 후보입니다. 매수 신호가 아닙니다.</p>
<section class="cards"><div class="box">🟢 소액 검토<div class="n" id="review">-</div></div><div class="box">🟠 눌림 대기<div class="n" id="wait">-</div></div><div class="box">🟡 관찰<div class="n" id="watch">-</div></div><div class="box">마지막 갱신<div class="n" id="time" style="font-size:16px">-</div></div></section><section id="list"></section></main>
<script>async function load(){try{const d=await fetch('./data/latest.json?v='+Date.now()).then(r=>r.json());const c=d.action_counts||{};review.textContent=c['소액 검토']??0;wait.textContent=c['눌림 대기']??0;watch.textContent=c['관찰']??0;time.textContent=d.updated_at;const cls={'소액 검토':'review','눌림 대기':'wait','관찰':'watch','제외':'exclude'};list.innerHTML=d.stocks.map((s,i)=>{const tv=`https://www.tradingview.com/chart/?symbol=KRX%3A${encodeURIComponent(s.code)}`;return `<article class="stock"><div class="top"><div><b style="font-size:23px">${i+1}. ${s.name}</b><div class="sub">${s.market} · ${s.code}</div></div><span class="tag ${cls[s.action]||'watch'}">${s.action}</span></div><div class="decision">지금은 ${s.action}</div><div class="why">${s.action_reason||'가격 구조를 관찰하고 있어요'}</div><div class="facts"><div class="fact"><span>종목 힘</span><b>${s.strength||'기록 부족'}</b></div><div class="fact"><span>현재 위치</span><b>${s.position||'기록 부족'}</b></div><div class="fact"><span>현재가</span><b>${s.price.toLocaleString()}원</b></div><div class="fact"><span>오늘 등락</span><b>${s.change>0?'+':''}${s.change}%</b></div></div><details class="details"><summary>상세 숫자 보기</summary><div style="margin-top:8px">기존 점수 ${s.score}점 · ${s.reason}</div></details><a class="chartlink" href="${tv}" target="_blank" rel="noopener">트레이딩뷰 차트 바로가기</a></article>`}).join('')||`<article class="stock">첫 분석을 준비 중입니다.</article>`}catch(e){list.innerHTML='<article class="stock">첫 분석을 준비 중입니다. 잠시 후 다시 확인하세요.</article>'}}load()</script></body></html>
