<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 한국주식 3단계 검색기</title>
<style>
:root{color-scheme:dark;--bg:#06111d;--card:#0d1b2b;--line:#203a51;--text:#f2f7fc;--muted:#91a6b9;--yellow:#ffd166;--orange:#ff9f43;--green:#3de0ad;--blue:#70c6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 15px 70px}.status{color:var(--green);font-size:13px}h1{margin:7px 0 5px;font-size:27px}.desc,.updated{color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 13px}.sum{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:14px}.sum span{display:block;color:var(--muted);font-size:13px}.sum b{display:block;font-size:27px;margin-top:4px}.sum.yellow{border-color:#66572b}.sum.orange{border-color:#754b26}.sum.green{border-color:#1c735c}.guide{margin:15px 0 20px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:13px}.guide b{color:var(--text)}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;align-items:start}.lane{border:1px solid var(--line);border-radius:17px;background:#091725;overflow:hidden}.lanehead{padding:15px;border-bottom:1px solid var(--line)}.lanehead h2{font-size:19px;margin:0 0 4px}.lanehead p{margin:0;color:var(--muted);font-size:12px}.lane.yellow .lanehead{background:#302916}.lane.orange .lanehead{background:#352314}.lane.green .lanehead{background:#0e3029}.cards{padding:9px}.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.symbol{font-size:20px;font-weight:900}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;white-space:nowrap}.yellow .badge{background:#4b401d;color:var(--yellow)}.orange .badge{background:#54331b;color:var(--orange)}.green .badge{background:#123f34;color:var(--green)}.price{font-size:12px;color:var(--muted);margin:4px 0 10px}.reasons{display:grid;gap:6px}.reason{font-size:13px;padding-left:18px;position:relative}.reason:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900}.actions{margin-top:12px}.actions a{display:block;text-decoration:none;text-align:center;color:var(--blue);border:1px solid #356281;padding:9px;border-radius:9px;font-size:12px;font-weight:800}details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}.tech{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;font-size:11px;color:var(--muted)}.tech b{display:block;color:var(--text);font-size:12px}.footerDetails{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}@media(max-width:850px){.lanes{grid-template-columns:1fr}}@media(max-width:480px){h1{font-size:23px}.summary{gap:6px}.sum{padding:11px 8px}.sum b{font-size:23px}.sum span{font-size:11px}.wrap{padding:15px 10px 50px}}
</style></head><body><main class="wrap">
<div class="status">● 한국시장 일일 데이터</div><h1>BES 한국주식 3단계 검색기</h1><div class="desc">관찰 → 눌림 대기 → 소액 검토 순서로 확인하세요.</div>
<section class="summary"><div class="sum yellow"><span>🟡 관찰</span><b id="yellowCount">-</b></div><div class="sum orange"><span>🟠 눌림 대기</span><b id="orangeCount">-</b></div><div class="sum green"><span>🟢 소액 검토</span><b id="greenCount">-</b></div></section>
<div id="updated" class="updated"></div><div class="guide"><b>보는 방법:</b> 초록색부터 확인하세요. 주황색은 강하지만 지금 추격하지 않고 눌림을 기다립니다. 노란색은 방향을 더 확인하는 단계입니다.</div>
<section class="lanes"><div class="lane green"><div class="lanehead"><h2>🟢 소액 검토</h2><p>힘과 위치가 함께 확인된 종목</p></div><div id="greenCards" class="cards"></div></div><div class="lane orange"><div class="lanehead"><h2>🟠 눌림 대기</h2><p>강하지만 지금은 추격하지 않는 종목</p></div><div id="orangeCards" class="cards"></div></div><div class="lane yellow"><div class="lanehead"><h2>🟡 관찰</h2><p>방향을 더 확인해야 하는 종목</p></div><div id="yellowCards" class="cards"></div></div></section>
<details class="footerDetails"><summary>제외 종목 보기</summary><div id="excludedCards"></div></details></main>
<script>
const fmt=n=>Number(n||0).toLocaleString();const card=(s,color)=>{const tv=`https://www.tradingview.com/chart/?symbol=KRX%3A${encodeURIComponent(s.code)}`;return `<article class="card"><div class="cardtop"><div class="symbol">${s.name}</div><span class="badge">${s.action}</span></div><div class="price">${s.market} · ${s.code} · 현재가 ${fmt(s.price)}원</div><div class="reasons"><div class="reason">종목 힘은 ${s.strength||'확인 중'}이에요</div><div class="reason">현재 위치는 ${s.position||'확인 중'}이에요</div><div class="reason">${s.action_reason||'가격 구조를 관찰하고 있어요'}</div></div><div class="actions"><a href="${tv}" target="_blank" rel="noopener">트레이딩뷰</a></div><details><summary>상세 숫자 보기</summary><div class="tech"><div>기존 점수<b>${s.score}점</b></div><div>오늘 등락<b>${s.change>0?'+':''}${s.change}%</b></div><div style="grid-column:1/-1">가격·거래량 구조<b>${s.reason}</b></div></div></details></article>`};const render=(el,rows,color,msg)=>el.innerHTML=rows.length?rows.map(s=>card(s,color)).join(''):`<div class="empty">${msg}</div>`;async function load(){try{const d=await fetch('./data/latest.json?v='+Date.now()).then(r=>r.json()),all=d.stocks||[],green=all.filter(s=>s.action==='소액 검토'),orange=all.filter(s=>s.action==='눌림 대기'),yellow=all.filter(s=>s.action==='관찰'),excluded=all.filter(s=>s.action==='제외');greenCount.textContent=green.length;orangeCount.textContent=orange.length;yellowCount.textContent=yellow.length;updated.textContent=`마지막 반영 ${d.updated_at} · 전체 ${d.count}종목 분석`;render(greenCards,green,'green','지금은 소액 검토 종목이 없습니다.');render(orangeCards,orange,'orange','지금은 눌림 대기 종목이 없습니다.');render(yellowCards,yellow,'yellow','지금은 관찰 종목이 없습니다.');excludedCards.innerHTML=excluded.length?excluded.map(s=>`<div class="price">${s.name} · ${s.position}</div>`).join(''):'<div class="empty">제외 종목이 없습니다.</div>'}catch(e){updated.textContent='데이터를 준비하고 있습니다.'}}load();
</script></body></html>
