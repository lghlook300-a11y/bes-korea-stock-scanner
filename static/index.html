<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 한국주식 검색기</title>
<style>body{margin:0;background:#071521;color:#ecf5ff;font-family:system-ui}.wrap{max-width:960px;margin:auto;padding:28px 18px}.sub{color:#86a6bd}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box,.stock{background:#0d2132;border:1px solid #23425a;border-radius:15px;padding:18px}.n{font-size:28px;font-weight:800}.stock{margin-top:14px}.top{display:flex;justify-content:space-between}.score{color:#54d7ae;font-weight:800}.tag{background:#143e5c;border-radius:9px;padding:6px 10px;color:#7dd3fc}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.reason{color:#9bb5c8;margin-top:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.meta{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div style="color:#54d7ae">● 한국시장 데이터 연결</div><h1>BES 한국주식 후보 검색기</h1><p class="sub">시장 → 거래대금 → 가격 구조를 확인한 연구용 후보입니다. 매수 신호가 아닙니다.</p>
<section class="cards"><div class="box">시장 상태<div class="n" id="state">확인 중</div></div><div class="box">분석 종목<div class="n" id="count">-</div></div><div class="box">마지막 갱신<div class="n" id="time" style="font-size:18px">-</div></div></section><section id="list"></section></main>
<script>async function load(){const d=await fetch('/api/scan').then(r=>r.json());state.textContent=d.market_state;count.textContent=d.count;time.textContent=d.updated_at;list.innerHTML=d.stocks.map((s,i)=>`<article class="stock"><div class="top"><div><b style="font-size:23px">${i+1}. ${s.name}</b><div class="sub">${s.market} · ${s.code}</div></div><div><span class="score">${s.score}점</span> <span class="tag">${s.action}</span></div></div><div class="meta"><div>현재가 <b>${s.price.toLocaleString()}원</b></div><div>등락률 <b>${s.change}%</b></div></div><div class="reason">${s.reason}</div></article>`).join('')||`<article class="stock">데이터를 불러오는 중이거나 장이 쉬는 날입니다. 잠시 후 새로고침하세요.</article>`}load();setInterval(load,600000)</script></body></html>
